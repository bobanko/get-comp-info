# Publishes a release to the cloud when a version tag is pushed: v2026.10.24.1 for the toolbox (comp-info.exe and
# the console version), suspector-v2026.11.13.1 for SUSpector. Each program has its own version.
# See PROGRAM_UPDATE.md. No secrets: the cloud trusts GitHub's OIDC token for this repository.
name: Release

on:
  push:
    tags: ['v*', 'suspector-v*']

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run tests (Windows PowerShell 5.1)
        shell: pwsh
        run: |
          foreach ($test in Get-ChildItem tests -Filter '*.tests.ps1') {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $test.FullName
            if ($LASTEXITCODE -ne 0) { throw "$($test.Name) failed" }
          }

      - name: Build the programs and run their checks
        shell: cmd
        run: tools\build.BAT

      - name: Build the toolbox release
        if: ${{ !startsWith(github.ref_name, 'suspector-v') }}
        shell: pwsh
        # Same Windows PowerShell 5.1 as on the flash drives. Fails when the tag does not match console-ui.ps1.
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/build-release.ps1 -Version $env:GITHUB_REF_NAME.Substring(1)
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }

      - name: Build the SUSpector release
        if: ${{ startsWith(github.ref_name, 'suspector-v') }}
        shell: pwsh
        # Fails when the tag does not match app/SUSpector.version.
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/build-suspector-release.ps1 -Version $env:GITHUB_REF_NAME.Substring('suspector-v'.Length)
          if ($LASTEXITCODE -ne 0) { throw 'SUSpector build failed' }

      - name: Publish to the cloud
        shell: pwsh
        run: |
          $tokenUrl = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=comp-info-release"
          $token = (Invoke-RestMethod -Uri $tokenUrl -Headers @{ Authorization = "bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }).value
          if ($env:GITHUB_REF_NAME.StartsWith('suspector-v')) {
            $version = $env:GITHUB_REF_NAME.Substring('suspector-v'.Length)
            ./tools/publish-release.ps1 -Package "dist/SUSpector-$version.zip" -Token $token -ApiUrl 'https://comp-info.chagear.top/api/suspector-release'
          } else {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            ./tools/publish-release.ps1 -Package "dist/comp-info-$version.zip" -Token $token
          }
